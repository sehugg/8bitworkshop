# Linker config file for hand-written ca65 programs on the Atari 2600.
#
# A plain 4K cartridge: the program supplies its own reset code and vectors,
# so nothing here comes from the C runtime. C programs use atari2600.cfg
# instead, which is the bank-switched (3E mapper) layout vcslib expects and
# which links crt0.o and atari2600.lib.

MEMORY {
       ZP:    start = $80,   size = $80,   type = rw, define = yes;
       TIA:   start = $00,   size = $40,   type = rw, define = yes;
       RIOT:  start = $280,  size = $20,   type = rw, define = yes;
       ROM:   start = $F000, size = $1000, type = ro, file = %O, fill = yes, define = yes;
}

SEGMENTS {
       STARTUP:  load = ROM, type = ro, optional = yes;
       CODE:     load = ROM, type = ro, define = yes;
       RODATA:   load = ROM, type = ro, optional = yes;
       # no crt0 to copy initialized data into RAM, so it stays in the cart
       DATA:     load = ROM, type = ro, optional = yes;
       VECTORS:  load = ROM, type = ro, start = $FFFA;

       ZEROPAGE: load = ZP,  type = zp,  optional = yes;
       BSS:      load = ZP,  type = bss, optional = yes;
       TIA:      load = TIA,  type = rw, define = yes, optional = yes;
       RIOT:     load = RIOT, type = rw, define = yes, optional = yes;
}
